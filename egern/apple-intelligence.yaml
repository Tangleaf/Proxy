name: Apple Intelligence 分流
description: Apple Intelligence、Siri 与 Private Cloud Compute 精简分流模块。
author: Tangleaf
homepage: https://github.com/Tangleaf/Proxy
icon: apple.intelligence

compat_arguments:
  TARGET_POLICY: "Proxy"

compat_arguments_desc: "TARGET_POLICY：填写主配置中已有的策略或策略组名称，例如 Proxy、AI、美国节点。"

rules:
  - domain:
      match: api-glb-sea.smoot.apple.com
      policy: "{{{TARGET_POLICY}}}"

  - domain_suffix:
      match: smoot.apple.com
      policy: "{{{TARGET_POLICY}}}"
  - domain_suffix:
      match: guzzoni.apple.com
      policy: "{{{TARGET_POLICY}}}"
  - domain_suffix:
      match: apple-relay.apple.com
      policy: "{{{TARGET_POLICY}}}"
  - domain_suffix:
      match: apple-relay.cloudflare.com
      policy: "{{{TARGET_POLICY}}}"
  - domain_suffix:
      match: gateway.icloud.com
      policy: "{{{TARGET_POLICY}}}"

  - domain_keyword:
      match: apple-relay
      policy: "{{{TARGET_POLICY}}}"
